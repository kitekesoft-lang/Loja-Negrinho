<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle / Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern on background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="384" x2="448" y2="384" />
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
  </g>

  <!-- Central POS Symbol Container -->
  <g filter="url(#glow)">
    <!-- Base POS Register / Cash Drawer -->
    <rect x="116" y="270" width="280" height="130" rx="24" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="136" y="325" width="180" height="28" rx="8" fill="#e2e8f0"/>
    <circle cx="346" cy="339" r="14" fill="url(#cartGrad)"/>
    <rect x="136" y="365" width="240" height="8" rx="4" fill="#cbd5e1"/>

    <!-- Screen Tablet on POS -->
    <path d="M 166 140 L 346 140 C 358 140 368 150 368 162 L 368 270 L 144 270 L 144 162 C 144 150 154 140 166 140 Z" fill="#0f172a"/>
    <rect x="156" y="152" width="200" height="106" rx="8" fill="#1e293b"/>

    <!-- Barcode and Scan Beam on screen -->
    <g fill="#38bdf8">
      <rect x="178" y="172" width="5" height="40" rx="2"/>
      <rect x="187" y="172" width="8" height="40" rx="2"/>
      <rect x="200" y="172" width="4" height="40" rx="2"/>
      <rect x="208" y="172" width="10" height="40" rx="2"/>
      <rect x="224" y="172" width="6" height="40" rx="2"/>
      <rect x="235" y="172" width="4" height="40" rx="2"/>
      <rect x="244" y="172" width="12" height="40" rx="2"/>
      <rect x="262" y="172" width="4" height="40" rx="2"/>
      <rect x="271" y="172" width="8" height="40" rx="2"/>
      <rect x="284" y="172" width="5" height="40" rx="2"/>
      <rect x="294" y="172" width="9" height="40" rx="2"/>
      <rect x="308" y="172" width="4" height="40" rx="2"/>
      <rect x="317" y="172" width="8" height="40" rx="2"/>
      <rect x="328" y="172" width="4" height="40" rx="2"/>
    </g>

    <!-- Laser Line in Emerald -->
    <line x1="168" y1="192" x2="344" y2="192" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>

    <!-- Cash Total Pill on Tablet -->
    <rect x="184" y="224" width="144" height="22" rx="11" fill="url(#cartGrad)"/>
    <text x="256" y="239" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" fill="#ffffff" letter-spacing="1">POS FISCAL</text>

    <!-- Checkmark Badge on top right -->
    <circle cx="372" cy="130" r="32" fill="url(#badgeGrad)"/>
    <path d="M 358 130 L 368 140 L 388 120" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
