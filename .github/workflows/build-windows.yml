name: Gerar Executável Windows (.exe)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm install --legacy-peer-deps

      - name: Compilar Frontend Vite
        run: npm run build

      - name: Gerar Executáveis Windows (.exe) Portáteis (x64 e 32-bit Win7+)
        run: node scripts/package-desktop.cjs --all

      - name: Listar Ficheiros Gerados na Pasta release
        run: ls -la release/

      - name: Publicar Executáveis (.exe) e Pacotes (.zip) como Artefactos
        uses: actions/upload-artifact@v4
        with:
          name: Kiteke-Pro-Windows-EXE
          path: |
            release/*.zip
            release/win-unpacked/*.exe
            release/win-ia32-unpacked/*.exe
          if-no-files-found: error
          retention-days: 14

